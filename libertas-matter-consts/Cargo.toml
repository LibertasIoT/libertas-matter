[package]
name = "libertas-matter-consts"
version = "1.0.0"
edition = "2021"
description = "Auto-generated Matter schema constants"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "README.md",
    "src/**/*.rs",
]

[lib]
name = "libertas_matter_consts"
path = "src/lib.rs"

[dependencies]
libertas-matter-macros = { path = "../rs-matter-macros" }
