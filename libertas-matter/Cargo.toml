[package]
name = "libertas-matter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Matter TLV and typed Libertas logical-device runtime"
readme = "README.md"
keywords = ["matter", "no-std", "iot", "libertas"]
categories = ["embedded", "encoding", "no-std"]

[lib]
crate-type = ["rlib"]

[features]
default = ["alloc"]
alloc = []
std = ["alloc"]

[dependencies]
libertas = { path = "../../libertas-rs/crates/libertas", package = "libertas" }
libertas-matter-consts = { path = "../libertas-matter-consts" }
libertas-matter-macros = { path = "../libertas-matter-macros" }
